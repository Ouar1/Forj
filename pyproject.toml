[project]
name = "xlink"
version = "3.1.0"
description = "Infraestructura TI Profesional — Redes, servidores y automatización para empresas"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
