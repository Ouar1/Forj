version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - xlink.db:/app/xlink.db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xlink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xlink_secret}
      POSTGRES_DB: xlink
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlink"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  uploads:
  pgdata:
